<!DOCTYPE html>
<html>
<head>
  <title>Your Cart - Shoe Heaven</title>
  <meta name="viewport" content="width=device-width" />
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background: #000;
      padding: 15px 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: red;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border-bottom: 1px solid #444;
      padding: 10px;
      text-align: center;
    }

    th {
      color: #ff3333;
    }

    .total {
      text-align: right;
      font-size: 20px;
      margin-top: 10px;
    }

    .btn {
      background: red;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      margin: 5px;
    }

    .btn:hover {
      background: darkred;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    a.back-home {
      color: #ff3333;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h2>Shoe Heaven - Your Cart</h2>
  </div>
</header>

<div class="container">
  <h1>🛍️ Your Shopping Cart</h1>
  <table id="cart-table">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price (₹)</th>
        <th>Quantity</th>
        <th>Total (₹)</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="total" id="cart-total">Total: ₹0</div>

  <div class="actions">
    <button class="btn" id="clear-cart">Clear Cart</button>
    <button class="btn" id="checkout">Checkout</button>
  </div>

  <a href="index.html" class="back-home">← Continue Shopping</a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const tableBody = document.querySelector('#cart-table tbody');
const totalDisplay = document.getElementById('cart-total');

function renderCart() {
  tableBody.innerHTML = '';
  let total = 0;

  if (cart.length === 0) {
    tableBody.innerHTML = '<tr><td colspan="5">Your cart is empty.</td></tr>';
    totalDisplay.textContent = 'Total: ₹0';
    return;
  }

  cart.forEach((item, index) => {
    let itemTotal = item.price * item.qty;
    total += itemTotal;

    let row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.name}</td>
      <td>${item.price}</td>
      <td>${item.qty}</td>
      <td>${itemTotal}</td>
      <td><button class="btn" onclick="removeItem(${index})">X</button></td>
    `;
    tableBody.appendChild(row);
  });

  totalDisplay.textContent = 'Total: ₹' + total;
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

document.getElementById('clear-cart').addEventListener('click', () => {
  if (confirm('Are you sure you want to clear your cart?')) {
    localStorage.removeItem('cart');
    cart = [];
    renderCart();
  }
});

document.getElementById('checkout').addEventListener('click', () => {
  if (cart.length === 0) {
    alert('Your cart is empty!');
  } else {
    alert('Proceeding to checkout!');
    // You can redirect to a checkout.html page later
  }
});

renderCart();
</script>

</body>
</html>
